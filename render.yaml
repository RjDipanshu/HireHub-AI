services:
  # =============================================================================
  # 1. Backend Web Service (Spring Boot 3 + Java 17 Docker)
  # =============================================================================
  - type: web
    name: hirehub-backend
    env: docker
    dockerfilePath: ./backend/hirehub-backend/hirehub-backend/Dockerfile
    dockerContext: ./backend/hirehub-backend/hirehub-backend
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: PORT
        value: 8080
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: SUPABASE_JWT_ISSUER
        sync: false
      - key: SUPABASE_JWK_SET_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  # =============================================================================
  # 2. Frontend Static Site (React 19 + Vite SPA)
  # =============================================================================
  - type: static
    name: hirehub-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
