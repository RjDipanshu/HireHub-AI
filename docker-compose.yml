services:
  # ---------------------------------------------------------------------------
  # Spring Boot 3 REST API Backend
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend/hirehub-backend/hirehub-backend
      dockerfile: Dockerfile
    container_name: hirehub-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL:-jdbc:postgresql://db.qbdcvnkomdzqfxevlhhj.supabase.co:5432/postgres}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD:-Dipanshu@0807}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:80,http://localhost:5173}
      - SUPABASE_JWT_ISSUER=${SUPABASE_JWT_ISSUER:-https://qbdcvnkomdzqfxevlhhj.supabase.co/auth/v1}
      - SUPABASE_JWK_SET_URI=${SUPABASE_JWK_SET_URI:-https://qbdcvnkomdzqfxevlhhj.supabase.co/auth/v1/.well-known/jwks.json}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    networks:
      - hirehub-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/v3/api-docs"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  # ---------------------------------------------------------------------------
  # React + Vite + Nginx Frontend
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_SUPABASE_URL=${VITE_SUPABASE_URL:-https://qbdcvnkomdzqfxevlhhj.supabase.co}
        - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.e30.dummy}
        - VITE_API_BASE_URL=/api/v1
    container_name: hirehub-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_started
    networks:
      - hirehub-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3

networks:
  hirehub-network:
    driver: bridge
