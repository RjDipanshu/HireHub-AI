# ===============================
# APPLICATION
# ===============================
spring.application.name=hirehub-backend

# ===============================
# SERVER
# ===============================
server.port=${PORT:8080}

# ===============================
# DATASOURCE (Environment-Driven with Fallbacks)
# ===============================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://db.qbdcvnkomdzqfxevlhhj.supabase.co:5432/postgres}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# HikariCP Connection Pool Hardening (Phase 22.0)
spring.datasource.hikari.pool-name=HireHub-HikariPool
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=10000

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ===============================
# LOGGING
# ===============================
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=INFO
logging.level.com.hirehub.hirehub_backend=INFO

# ===============================
# CORS
# ===============================
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# ===============================
# OPENAPI / SWAGGER
# ===============================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha

# ===============================
# SUPABASE JWT / RESOURCE SERVER
# ===============================
spring.security.oauth2.resourceserver.jwt.issuer-uri=${SUPABASE_JWT_ISSUER:https://qbdcvnkomdzqfxevlhhj.supabase.co/auth/v1}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${SUPABASE_JWK_SET_URI:https://qbdcvnkomdzqfxevlhhj.supabase.co/auth/v1/.well-known/jwks.json}

# ===============================
# SPRING BOOT ACTUATOR & MONITORING
# ===============================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.db.enabled=true

# ===============================
# TRANSACTIONAL EMAIL (SMTP)
# ===============================
spring.mail.host=${SPRING_MAIL_HOST:}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.connectiontimeout=${SPRING_MAIL_CONNECTION_TIMEOUT:5000}
spring.mail.properties.mail.smtp.timeout=${SPRING_MAIL_TIMEOUT:5000}
spring.mail.properties.mail.smtp.writetimeout=${SPRING_MAIL_WRITE_TIMEOUT:5000}
app.mail.from=${MAIL_FROM:supporthirehub.ai@gmail.com}
app.mail.support=${SUPPORT_EMAIL:supporthirehub.ai@gmail.com}
app.mail.retry.max-attempts=${EMAIL_MAX_RETRIES:3}
app.mail.retry.delay-ms=${EMAIL_RETRY_DELAY_MS:5000}

# ===============================
# FRONTEND APPLICATION URL
# ===============================
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}

# ===============================
# JOB AGGREGATION (External Sources)
# ===============================
# Adzuna API (https://developer.adzuna.com/)
aggregator.adzuna.app-id=${ADZUNA_APP_ID:}
aggregator.adzuna.api-key=${ADZUNA_API_KEY:}
aggregator.adzuna.country=${ADZUNA_COUNTRY:in}
aggregator.adzuna.enabled=${ADZUNA_ENABLED:true}

# Greenhouse Job Board API (public boards — no auth required)
aggregator.greenhouse.enabled=${GREENHOUSE_ENABLED:false}
aggregator.greenhouse.board-tokens=${GREENHOUSE_BOARD_TOKENS:}

# Lever Postings API (public postings — no auth required)
aggregator.lever.enabled=${LEVER_ENABLED:false}
aggregator.lever.company-slugs=${LEVER_COMPANY_SLUGS:}

# Aggregation Scheduling & Behavior
aggregator.sync-cron=${AGGREGATOR_SYNC_CRON:0 0 */6 * * *}
aggregator.max-pages-per-sync=${AGGREGATOR_MAX_PAGES:5}
aggregator.expiry-days=${AGGREGATOR_EXPIRY_DAYS:30}

# ===============================
# WEBHOOKS & REAL-TIME INGESTION
# ===============================
app.webhook.secret=${WEBHOOK_INGESTION_SECRET:hirehub-webhook-default-secret}