# ===============================
# APPLICATION (PRODUCTION)
# ===============================
spring.application.name=hirehub-backend

# ===============================
# SERVER
# ===============================
server.port=${PORT:8080}
server.error.include-stacktrace=never
server.error.include-message=always

# ===============================
# DATASOURCE
# ===============================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# HikariCP Hardening
spring.datasource.hikari.pool-name=HireHub-HikariPool-Prod
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=10000

# ===============================
# JPA / HIBERNATE
# ===============================
# CRITICAL: Prevent destructive schema operations in production
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ===============================
# LOGGING
# ===============================
logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
logging.level.com.hirehub.hirehub_backend=INFO

# ===============================
# CORS
# ===============================
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# ===============================
# SUPABASE JWT / RESOURCE SERVER
# ===============================
spring.security.oauth2.resourceserver.jwt.issuer-uri=${SUPABASE_JWT_ISSUER}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${SUPABASE_JWK_SET_URI}

# ===============================
# SPRING BOOT ACTUATOR & MONITORING
# ===============================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.db.enabled=true

# ===============================
# TRANSACTIONAL EMAIL (SMTP)
# ===============================
spring.mail.host=${SPRING_MAIL_HOST}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.connectiontimeout=${SPRING_MAIL_CONNECTION_TIMEOUT:5000}
spring.mail.properties.mail.smtp.timeout=${SPRING_MAIL_TIMEOUT:5000}
spring.mail.properties.mail.smtp.writetimeout=${SPRING_MAIL_WRITE_TIMEOUT:5000}
app.mail.from=${MAIL_FROM}
app.mail.support=${SUPPORT_EMAIL}
app.mail.retry.max-attempts=${EMAIL_MAX_RETRIES:3}
app.mail.retry.delay-ms=${EMAIL_RETRY_DELAY_MS:5000}

# ===============================
# FRONTEND APPLICATION URL
# ===============================
app.frontend-url=${APP_FRONTEND_URL}

# ===============================
# GEMINI AI
# ===============================
gemini.api.key=${GEMINI_API_KEY}

# ===============================
# WEBHOOKS & REAL-TIME INGESTION
# ===============================
app.webhook.secret=${WEBHOOK_INGESTION_SECRET:}
