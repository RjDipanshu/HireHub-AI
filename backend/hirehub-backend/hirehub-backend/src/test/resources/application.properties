# ===============================
# TEST APPLICATION PROPERTIES (H2 In-Memory DB)
# ===============================
spring.application.name=hirehub-backend-test

# DataSource: H2 in-memory with PostgreSQL mode
spring.datasource.url=jdbc:h2:mem:hirehubtest;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Supabase JWT Mock for test environment
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://test.supabase.co/auth/v1
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://test.supabase.co/auth/v1/.well-known/jwks.json

# Transactional Email Test Properties
spring.mail.host=localhost
spring.mail.port=1025
app.frontend-url=http://localhost:5173
app.mail.from=supporthirehub.ai@gmail.com
app.mail.support=supporthirehub.ai@gmail.com
